; =================================================================================================
; GENERAL SETTINGS
; =================================================================================================
[General]
; Internal buffering (seconds) – leave default unless debugging
BUFFER_SIZE = 370 ; that is, the internal buffer size for MeteoIO in seconds. This determines how much meteorological data is loaded into memory at a time.
BUFF_BEFORE = 1.5 ; that is, the amount of time in days that MeteoIO is allowed to look back before the start of the simulation to find meteorological data.


; =================================================================================================
; INPUT SETTINGS
; =================================================================================================
[Input]

; HRRR point forcing → geographic coordinates
COORDSYS = EPSG:32608 ; UTM zone 8N, which covers the western US where HRRR is available. 

; HRRR timestamps are UTC
TIME_ZONE = 0 ; that is, the timestamps in the HRRR point forcing files are in UTC. 

METEO = SMET ; that is, the meteorological inputs are in SMET format.
METEOPATH = ../input/met_hrrrak_lapserate_WY2020-WY2025 ; that is, the meteorological input files are located in the ./input directory. 

; Station definition: no station definition if there is not SNOWFILE otherwise SNOWPACK endlessly tries to read the station metadata from the SNOWFILE, which does not exist in this case since we are doing a cold start.
; STATION1 must match the station_id inside the SMET file
; STATION1 = HRRR_POINT ; that is, the station ID for the meteorological inputs is HRRR_POINT. 

; Cold start if no .sno exists
; SNOWFILE = HRRR_POINT ; that is, the initial snowpack file for the HRRR point forcing is HRRR_POINT. 
COLD_START = true ; that is, the snowpack evolution will start from a cold start, with no initial snowpack. 

; ====================
; PRECIPITATION PHASE
; ====================

; Precipitation phase partitioning
; Required if your SMET only has total precipitation (PSUM)
PSUM_PH::create = PRECSPLITTING

; Temperature threshold-based rain/snow split
PSUM_PH::PRECSPLITTING::type = THRESH

; Threshold temperature (K) below which precipitation is snow
; 274.35 K = 1.2 °C (example value, adjust as needed)
PSUM_PH::PRECSPLITTING::snow = 274.35


; =================================================================================================
; OUTPUT SETTINGS
; =================================================================================================
[Output]
COORDSYS = EPSG:32608
TIME_ZONE = 0

METEO = SMET
METEOPATH = ../output

; Experiment name (prefix for outputs)
; EXPERIMENT = HRRR_POINT
EXPERIMENT = base

; Snow output format
; SNOW = SMET ; that is, the snow output will be in SMET format.

; Write .sno restart files at each output time step (useful for debugging, but can be turned off for long runs to save disk space)
; SNOW_WRITE = false

; ====================
; TIMESERIES OUTPUT
; ====================

; output every
; 0.25 h,    0.5 h,     1.0 h,      3.0 h
; 0.0104167, 0.0208333, 0.04166667, 0.125

TS_WRITE = true
TS_FORMAT = SMET
TS_START = 0.0
TS_DAYS_BETWEEN =  0.04166667 ; that is, the time step for writing the timeseries outputs in days. 
; TS_DAYS_BETWEEN = 1 ; this would be 1 day 

; CF-compliant aggregated output (useful but optional)
; ACDD_WRITE = true 

; ====================
; PROFILE OUTPUT
; ====================
PROF_WRITE = true
PROF_FORMAT = PRO
PROF_START = 0.0
PROF_DAYS_BETWEEN = 0.04166667 ; that is, the time step for writing the profile outputs in days.  
; PROF_DAYS_BETWEEN = 1 ; this would be 1 day 

; false = keep native SNOWPACK layers
; AGGREGATE_PRF = false

; =================================================================================================
; SNOWPACK CORE
; =================================================================================================
[Snowpack]

; SNOWPACK timestep (minutes)
; Must be consistent with PSUM accumulation
; CALCULATION_STEP_LENGTH has cf interactions with PSUM::accumulate 
CALCULATION_STEP_LENGTH = 60 ; that is, the time step for calculating the snowpack evolution in minutes

; Use measured surface temperature if present
MEAS_TSS = false 
ENFORCE_MEASURED_SNOW_HEIGHTS = false ; that is, the measured snow heights will not be enforced in the snowpack evolution. 

; Shortwave radiation handling
; SW_MODE = BOTH ; that is, both incoming and reflected short wave radiation are measured. 
SW_MODE = INCOMING ; that is, only incoming short wave radiation is measured. 

; Heights (m) of wind and meteo forcing
HEIGHT_OF_WIND_VALUE = 10.0 ; that is, the height at which the wind speed is measured in the meteorological inputs. 
HEIGHT_OF_METEO_VALUES = 2.0 ; that is, the height at which the meteorological values (e.g., air temperature, humidity, etc.) are measured in the meteorological inputs. 

; Atmospheric stability scheme 
ATMOSPHERIC_STABILITY = MO_HOLTSLAG ; that is, the method for calculating the atmospheric stability for the wind speed and meteorological value calculations. 

; Aerodynamic roughness length (m)
ROUGHNESS_LENGTH = 0.002 

; Boundary-condition change settings
CHANGE_BC = false ; that is, Neumann boundary conditions will be used throughout the snowpack evolution. 
THRESH_CHANGE_BC = -1.0 ; that is, the threshold for changing the boundary conditions in meters of snow height. 

; Soil module setting
SNP_SOIL = false ; that is, the soil module will not be used in the snowpack evolution. 
SOIL_FLUX = false ; that is, the soil fluxes will not be calculated in the snowpack evolution. 

; Geothermal heat flux in W/m^2
GEO_HEAT = 0.06 ; that is, the geothermal heat flux in W/m^2. 

; Canopy representation
CANOPY = false ; that is, the canopy module will not be used in the snowpack evolution.


; ====================
; ADVANCED OPTIONS
; ====================
[SnowpackAdvanced]

; Fixed layer positions (m)
; FIXED_POSITIONS = 0.25 0.5 1.0 -0.25 -0.10 ; that is, the fixed positions for the snowpack evolution in meters. 

; Wind-driven snow erosion (still point-based)
SNOW_EROSION = true ; that is, snow erosion will be included in the snowpack evolution. 


; =================================================================================================
; METEO FILTERS
; =================================================================================================
[Filters]

; Precipitation must be >= 0
PSUM::filter1 = min
PSUM::arg1::soft = true
PSUM::arg1::min = 0.0

; Air temperature bounds (K)
TA::filter1 = min_max
TA::arg1::min = 240
TA::arg1::max = 320

; Relative humidity bounds
RH::filter1 = min_max
RH::arg1::min = 0.01
RH::arg1::max = 1.2

RH::filter2 = min_max
RH::arg2::soft = true
RH::arg2::min = 0.05
RH::arg2::max = 1.0

; Incoming shortwave radiation
ISWR::filter1 = min_max
ISWR::arg1::min = -10
ISWR::arg1::max = 1500

ISWR::filter2 = min_max
ISWR::arg2::soft = true
ISWR::arg2::min = 0
ISWR::arg2::max = 1500

; Reflected shortwave
RSWR::filter1 = min_max
RSWR::arg1::min = -10
RSWR::arg1::max = 1500

; Incoming longwave
ILWR::filter1 = min_max
ILWR::arg1::min = 188
ILWR::arg1::max = 600

; Wind speed bounds (m s-1)
VW::filter1 = min_max
VW::arg1::min = 0.0
VW::arg1::max = 50.0


; ====================
; TEMPORAL RESAMPLING
; for now, we are not using any of this since we did this all previously in the forcing generation step
; ====================
; [Interpolations1D]

; WINDOW_SIZE = 86400

; # we were already resampling PSUM to 1 hour, so no need to resample again here
; PSUM::resample = accumulate 
; PSUM::accumulate::period = 3600 # in seconds, so precip accumulated over 1 hour; this has to match the CALCULATION_STEP_LENGTH in the Snowpack section for the snowpack evolution to be consistent with the precipitation inputs.

; VW::resample = nearest
; VW::nearest::extrapolate = true

; DW::resample = nearest
; DW::nearest::extrapolate = true

; =================================================================================================
; GENERATORS
; =================================================================================================
[Generators]

# ground temperature is not provided in the HRRR point forcing, so we will use air temperature as a proxy for ground temperature, which is a common approach for snowpack modeling when ground temperature measurements are not available. 
; TSG::generator1 = COPY # this produced an error, the generator algorithm "COPY" is not implemented 
; TSG::arg1::src = TA

# if we wanted to use a constant ground temperature instead, we could use the CST generator to create a constant time series with a specified value (e.g., 273.15 K for 0°C), but in this case we will use the COPY generator to copy the air temperature as the ground temperature.
TSG::generator1 = CST
TSG::arg1::value = 273.15